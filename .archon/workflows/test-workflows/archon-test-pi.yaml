name: archon-test-pi
description: |
  Simple test workflow to verify the pi provider works with Archon.
  Triggers: "test pi", "test pi provider".

provider: pi
model: kiro/minimax-m2-5

nodes:
  - id: hello
    prompt: |
      Say "Hello from pi!" and then tell me what model you are and what tools you have access to.
      Keep it brief — just a few lines.

  - id: verify
    prompt: |
      The previous node said:

      $hello.output

      Confirm the pi provider is working by saying "Pi provider verified ✅" and nothing else.
    depends_on: [hello]

  - id: test-linear-mcp
    mcp: .archon/mcp/linear.json
    prompt: |
      Use the Linear MCP tools to get the currently logged in user.
      Call `linear_get_user` with query "me".
      Output the user's name and email. If the MCP tools are unavailable, say so explicitly.
    depends_on: [verify]
